name: AI Vision repair missing article headings

on:
  push:
    branches: [main]
    paths:
      - 'scripts/missing_h2_repair.py'
      - '.github/workflows/missing-h2-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivision-missing-h2-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Prepare headings and full backup
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/missing_h2_repair.py prepare
      - name: Save original content before writes
        uses: actions/upload-artifact@v4
        with:
          name: aivision-missing-h2-backup-${{ github.run_id }}
          path: |
            data/missing_h2_plan.json
            data/missing_h2_backup.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply and verify H2 structure
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/missing_h2_repair.py apply
      - name: Upload result
        if: ${{ always() && hashFiles('data/missing_h2_result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-missing-h2-result-${{ github.run_id }}
          path: data/missing_h2_result.json
          retention-days: 90
