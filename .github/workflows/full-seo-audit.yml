name: AIVision Full SEO Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/article_generator.py'
      - 'scripts/daily_selector.py'
      - 'scripts/wp_publisher.py'
      - 'scripts/seo_site_audit.py'
      - '.github/workflows/ai-vision.yml'
      - '.github/workflows/full-seo-audit.yml'
  schedule:
    - cron: '45 7 * * 0'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: ai-vision-full-seo-audit
  cancel-in-progress: false

jobs:
  seo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Scarica codice
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dipendenze per controllo SEO
        run: python -m pip install requests
      - name: Analisi SEO completa pubblica - nessuna pubblicazione
        run: python scripts/seo_site_audit.py
      - name: Carica report SEO anche in caso di problemi
        if: ${{ always() && hashFiles('data/seo_full_audit.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-full-seo-audit
          path: data/seo_full_audit.json
          retention-days: 90
