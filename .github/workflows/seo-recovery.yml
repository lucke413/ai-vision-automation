name: AI Vision - Recupero metadati SEO mancanti

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-vision-seo-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verifica script e test
        run: |
          python -m py_compile scripts/seo_archive_recovery.py scripts/seo_site_audit.py
          python -m unittest discover -s tests -p 'test_editorial_expansion.py'

      - name: Recupera soltanto le metadescrizioni mancanti
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SEO_ARCHIVE_ALLOW_WRITES: "YES"
        run: |
          python scripts/seo_archive_recovery.py --apply-meta --limit 2 --output data/seo_archive_recovery.json

      - name: Salva report e backup SEO
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-seo-recovery-report
          path: |
            data/seo_archive_recovery.json
            data/seo_archive_backups.json
          if-no-files-found: ignore
          retention-days: 30
