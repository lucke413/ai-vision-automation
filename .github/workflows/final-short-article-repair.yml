name: AI Vision finish short articles and offer corrections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final_short_article_repair.py'
      - '.github/workflows/final-short-article-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivision-final-short-article-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Prepare six final article updates
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/final_short_article_repair.py prepare
      - name: Save complete backup
        uses: actions/upload-artifact@v4
        with:
          name: aivision-final-short-articles-backup-${{ github.run_id }}
          path: |
            data/final_short_articles_plan.json
            data/final_short_articles_backup.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply and verify six updates
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/final_short_article_repair.py apply
      - name: Upload verification result
        if: ${{ always() && hashFiles('data/final_short_articles_result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-final-short-articles-result-${{ github.run_id }}
          path: data/final_short_articles_result.json
          retention-days: 90
