name: AIVision Historic SEO Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-archive-recovery.yml'

permissions:
  contents: read

jobs:
  seo-archive-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout senza credenziali WordPress
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install requests
      - name: Analizza archivio SEO in sola lettura
        run: python scripts/seo_archive_recovery.py
      - name: Salva elenco di interventi prioritari
        if: ${{ always() && hashFiles('data/seo_archive_recovery.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-historic-seo-recovery
          path: data/seo_archive_recovery.json
          retention-days: 30
