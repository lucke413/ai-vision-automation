name: AIVision Historic SEO Maintenance

on:
  workflow_dispatch:
    inputs:
      apply_safe_fixes:
        description: 'Correggi soltanto metadescrizioni mancanti, con backup e verifiche'
        type: boolean
        default: true
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-archive-recovery.yml'
  schedule:
    - cron: '25 6 * * *'
      timezone: Europe/Rome

permissions:
  contents: read

concurrency:
  group: ai-vision-seo-maintenance
  cancel-in-progress: false

jobs:
  seo-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      # Se WP_PUBLISH_MODE è dry-run, anche le riparazioni SEO restano in simulazione.
      SEO_ARCHIVE_ALLOW_WRITES: ${{ vars.WP_PUBLISH_MODE == 'live' && (github.event_name != 'workflow_dispatch' || inputs.apply_safe_fixes) && 'YES' || 'NO' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt
      - name: Verifica protezioni SEO
        run: python -m unittest discover -s tests -p 'test_seo_*.py' -v
      - name: Ripara solo metadescrizioni mancanti e documentate
        if: ${{ env.SEO_ARCHIVE_ALLOW_WRITES == 'YES' }}
        run: python scripts/seo_archive_recovery.py --apply-meta --limit 6
      - name: Simulazione quando la pubblicazione è disattivata
        if: ${{ env.SEO_ARCHIVE_ALLOW_WRITES != 'YES' }}
        run: python scripts/seo_archive_recovery.py
      - name: Conserva report e snapshot prima delle modifiche
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-seo-maintenance
          path: |
            data/seo_archive_recovery.json
            data/seo_archive_backups.json
          if-no-files-found: warn
          retention-days: 90
