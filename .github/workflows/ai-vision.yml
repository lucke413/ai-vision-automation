name: AI Vision Automation

on:
  workflow_dispatch:
    inputs:
      publish_live:
        description: 'Pubblica automaticamente su WordPress (disattiva per una simulazione)'
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ai-vision.yml'
      - '.github/workflows/legacy-content-repair.yml'
  # Push runs isolated regression checks only; the full editorial pipeline runs on schedule or explicit manual dispatch.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-cover.txt'
      - 'config/amazon-affiliate.json'
      - 'config/amazon-promotions.json'
      - '.github/workflows/ai-vision.yml'
      - '.github/workflows/legacy-content-repair.yml'
  schedule:
    - cron: '17 11 * * *'
      timezone: Europe/Rome
    - cron: '47 15,20 * * *'
      timezone: Europe/Rome
    # Gli importi e i link temporanei sono rimossi anche tra due edizioni.
    - cron: '24 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-vision-${{ github.ref }}-${{ github.event.schedule == '24 * * * *' && 'expire-offers' || 'editorial' }}
  cancel-in-progress: false

jobs:
  editorial-preflight:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout proposed code (no WordPress credentials)
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies for isolated tests
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile pipeline code
        run: python -m compileall -q scripts tests
      - name: Regression tests without external publishing
        env:
          WP_DRY_RUN: "true"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  repair-scheduled-affiliates:
    needs: editorial-preflight
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-AFFILIATE-REPAIR]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_DRY_RUN: ${{ vars.WP_PUBLISH_MODE == 'dry-run' && 'true' || 'false' }}
      AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Controlla e correggi gli articoli già programmati
        run: |
          if [ "$WP_DRY_RUN" = true ]; then
            python scripts/repair_scheduled_affiliates.py
          else
            python scripts/repair_scheduled_affiliates.py --apply
          fi

  amazon-editorial:
    needs: editorial-preflight
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.editorial-preflight.result == 'success' && contains(github.event.head_commit.message, '[AI-VISION-AMAZON-QA]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: ai-vision-amazon-wordpress-${{ github.ref }}
      cancel-in-progress: false
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_DRY_RUN: ${{ ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && !inputs.publish_live) || (github.event_name == 'schedule' && vars.WP_PUBLISH_MODE == 'dry-run')) && 'true' || 'false' }}
      AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
      AMAZON_PROMOTION_LINKS_JSON: ${{ vars.AMAZON_PROMOTION_LINKS_JSON }}
      AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      WP_TIMEZONE: Europe/Rome
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Rimuovi offerte scadute
        if: ${{ github.event.schedule == '24 * * * *' }}
        run: python scripts/amazon_promotions.py --expire
      - name: Verifica e pubblica la selezione Amazon
        if: ${{ github.event.schedule != '24 * * * *' }}
        run: |
          if [ "$WP_DRY_RUN" = false ]; then
            python -m pip install -r requirements-cover.txt
          fi
          python scripts/amazon_promotions.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('data/amazon_promotions_report.json') != '' }}
        with:
          name: ai-vision-amazon-promotions
          path: data/amazon_promotions_report.json
          retention-days: 7

  ai-pipeline:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-QA]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verifica configurazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name in (
              "data/rss_output.json",
              "data/ai_candidates.json",
              "data/ai_cyber_candidates.json",
              "data/daily_articles.json",
              "data/article_drafts.json",
          ):
              Path(name).unlink(missing_ok=True)
          if not os.environ.get("GEMINI_API_KEY", "").strip():
              raise SystemExit("ERRORE: configura il secret GEMINI_API_KEY nel repository.")
          for name in (
              "scripts/rss_collector.py",
              "scripts/ai_filter.py",
              "scripts/daily_selector.py",
              "scripts/history_filter.py",
              "scripts/article_generator.py",
              "scripts/editorial_originality.py",
              "scripts/wp_publisher.py",
              "requirements.txt",
          ):
              if not Path(name).is_file():
                  raise SystemExit(f"ERRORE: file mancante: {name}")
          PY

      - name: Installa e verifica dipendenze
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m py_compile scripts/rss_collector.py scripts/ai_filter.py scripts/daily_selector.py scripts/history_filter.py scripts/article_generator.py scripts/editorial_originality.py scripts/wp_publisher.py scripts/adsense_audit.py

      - name: Verifica equilibrio editoriale
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verifica versioni progetto
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          expected = {
              "scripts/rss_collector.py": "2.3.4",
              "scripts/ai_filter.py": "3.1.2",
              "scripts/daily_selector.py": "3.1",
              "scripts/article_generator.py": "5.0",
              "scripts/wp_publisher.py": "3.1",
          }

          for filename, wanted in expected.items():
              tree = ast.parse(Path(filename).read_text(encoding="utf-8"))
              found = None
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "VERSION":
                              if isinstance(node.value, ast.Constant):
                                  found = node.value.value
              print(f"{filename}: {found}")
              if found != wanted:
                  raise SystemExit(
                      f"ERRORE: {filename} versione {found!r}; richiesta {wanted!r}."
                  )
          print("OK: versioni coerenti")
          PY

      - name: Raccogli notizie RSS
        run: python scripts/rss_collector.py

      - name: Controlla Collector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/rss_output.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if not isinstance(items, list):
              raise SystemExit("ERRORE: formato collector non valido.")
          if not items:
              if data.get("status") != "empty":
                  raise SystemExit("ERRORE: collector vuoto senza stato empty.")
              print("AVVISO: nessuna storia RSS valida; la pipeline prosegue con output vuoto.")
          else:
              for item in items:
                  if not isinstance(item, dict) or not item.get("title") or not item.get("url"):
                      raise SystemExit("ERRORE: storia incompleta nel collector.")
                  if not isinstance(item.get("editorial_score"), (int, float)):
                      raise SystemExit("ERRORE: editorial_score mancante o non numerico.")
              print(f"OK: {len(items)} storie pronte per Gemini")
          PY

      - name: Analizza con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_filter.py

      - name: Controlla e mostra risultato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/ai_candidates.json").read_text(encoding="utf-8"))
          status = data.get("status")
          allowed_statuses = {"ok", "ok_with_warnings", "empty"}
          if status not in allowed_statuses:
              raise SystemExit("ERRORE: analisi AI non utilizzabile.")
          if data.get("total_final_candidates") != len(data.get("items", [])):
              raise SystemExit("ERRORE: conteggio candidati incoerente.")
          print(f"Articoli ricevuti: {data['total_received']}")
          print(f"Articoli analizzati: {data['total_analyzed']}")
          print(f"Errori Gemini tollerati: {data.get('total_errors', 0)}")
          print(f"Articoli non elaborati: {data.get('total_unprocessed', 0)}")
          print(f"Approvati: {data['total_passed_ai']}")
          print(f"Candidati finali: {data['total_final_candidates']}")
          if data.get("total_final_candidates", 0) < 6:
              print("AVVISO: meno di 6 candidati; il workflow prosegue con il lotto disponibile.")
          if status == "ok_with_warnings":
              print("AVVISO: il run prosegue con articoli esclusi per errori transitori.")
          for i, item in enumerate(data["items"], 1):
              print(f"{i}. [{item['final_score']}] [{item['category']}] {item['title']}")
          PY

      - name: Raccogli fonti per IA e cybersicurezza
        run: python scripts/ai_cyber.py

      - name: Escludi notizie già pubblicate o pianificate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/history_filter.py

      - name: Seleziona articoli giornalieri
        run: python scripts/daily_selector.py

      - name: Controlla selezione giornaliera
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/daily_articles.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if data.get("status") not in {"ok", "ok_with_warnings", "empty"} or not isinstance(items, list) or len(items) > 7:
              raise SystemExit("ERRORE: selezione giornaliera non valida.")
          cyber = sum(bool(item.get("ai_cyber_topic")) for item in items)
          if cyber > 1 or len(items) - cyber > 6:
              raise SystemExit("ERRORE: superato il numero di slot ordinari o IA e cybersicurezza.")
          ids = [item.get("article_id") for item in items]
          if not all(ids) or len(ids) != len(set(ids)):
              raise SystemExit("ERRORE: identificativi articolo mancanti o duplicati.")
          reserves = data.get("reserve_items", [])
          if not isinstance(reserves, list) or len(reserves) > 12:
              raise SystemExit("ERRORE: coda di riserva non valida.")
          reserve_ids = [item.get("article_id") for item in reserves]
          if any(item_id in ids for item_id in reserve_ids) or len(reserve_ids) != len(set(reserve_ids)):
              raise SystemExit("ERRORE: duplicati tra articoli giornalieri e riserve.")
          print(f"OK: {len(items)} articoli giornalieri; IA e cybersicurezza: {cyber}; riserve: {len(reserves)}; offerte: {data.get('offer_count', 0)}")
          for warning in data.get("warnings", []):
              print(f"AVVISO selezione: {warning}")
          if data.get("offer_count", 0) > 1:
              print("AVVISO: più di un'offerta usata perché non c'erano abbastanza notizie non commerciali.")
          PY

      - name: Genera bozze articoli
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/article_generator.py

      - name: Controlla bozze articoli
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/article_drafts.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if data.get("status") not in {"ok", "ok_with_warnings", "empty"} or not isinstance(items, list) or len(items) > 19:
              raise SystemExit("ERRORE: output bozze non valido.")
          ids = [item.get("draft_id") for item in items]
          if not all(ids) or len(ids) != len(set(ids)):
              raise SystemExit("ERRORE: bozze con identificativi mancanti o duplicati.")
          for item in items:
              if not item.get("body_markdown", "").strip() or not item.get("title"):
                  raise SystemExit("ERRORE: bozza senza contenuto.")
              if item.get("generator_version"):
                  check = item.get("originality_check")
                  if not isinstance(check, dict) or check.get("status") not in {"pass", "not_applicable"} or check.get("publishable") is not True:
                      raise SystemExit(f"ERRORE: bozza senza controllo originalità superato: {item.get('title', 'articolo')}")
              if item.get("publication_slot") not in {"today", "reserve"}:
                  raise SystemExit("ERRORE: slot di pubblicazione mancante.")
              if item.get("publication_slot") == "today":
                  word_count = int(item.get("body_word_count", 0))
                  if word_count < 600:
                      # Non bloccare l'intero lotto per una singola bozza breve.
                      # Il publisher applica il controllo per singolo articolo e
                      # può pubblicare gli altri contenuti validi.
                      print(f"AVVISO qualità: articolo sotto 600 parole ({word_count}); il publisher lo valuterà singolarmente: {item.get('title', 'articolo')}")
                  if item.get("quality_warnings"):
                      print(f"AVVISO qualità: {item.get('title', 'articolo')} -> {item.get('quality_warnings')}")
          daily = sum(1 for item in items if item.get("publication_slot") == "today")
          cyber = sum(bool(item.get("ai_cyber_topic")) for item in items if item.get("publication_slot") == "today")
          if cyber > 1 or daily - cyber > 6:
              raise SystemExit("ERRORE: quote di pubblicazione superate nelle bozze.")
          print(f"Bozze giornaliere IA e cybersicurezza: {cyber}")
          reserve = sum(1 for item in items if item.get("publication_slot") == "reserve")
          rejected = data.get("rejected_items", [])
          print(f"OK: {len(items)} bozze approvate dal gate; oggi: {daily}; riserve: {reserve}; respinte per revisione: {len(rejected) if isinstance(rejected, list) else 0}.")
          for warning in data.get("warnings", []):
              print(f"AVVISO: {warning}")
          PY

      - name: Pubblica o pianifica su WordPress
        if: ${{ github.event_name != 'pull_request' }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_DRY_RUN: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-QA]')) || (github.event_name == 'workflow_dispatch' && !inputs.publish_live) || (github.event_name == 'schedule' && vars.WP_PUBLISH_MODE == 'dry-run')) && 'true' || 'false' }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
          WP_TIMEZONE: Europe/Rome
          WP_SLOT_TIMES: "08:00,10:30,14:00,16:30,18:30,20:30"
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          if [ "$WP_DRY_RUN" = false ]; then
            python -m pip install -r requirements-cover.txt || echo "::warning::Generatore immagini non installato. Le foto con licenza verificata possono ancora essere pubblicate."
          fi
          python scripts/wp_publisher.py

      - name: Controlla report WordPress
        if: ${{ always() && hashFiles('data/wp_publish_report.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/wp_publish_report.json").read_text(encoding="utf-8"))
          if data.get("status") not in {"dry_run", "ok", "ok_with_warnings", "empty"}:
              raise SystemExit("ERRORE: report WordPress non valido.")
          print(f"Publisher status: {data.get('status')}")
          print(f"Articoli richiesti: {data.get('requested', 0)}")
          print(f"Articoli elaborati: {data.get('completed', 0)}")
          print(f"Programmati su WP: {data.get('scheduled', 0)}; gia esistenti: {data.get('already_existing', 0)}")
          print("Online verificati: 0 (il report non esegue una verifica HTTP pubblica dei post).")
          for error in data.get("errors", []):
              print(f"AVVISO publisher: {error}")
          source_requested = int(data.get("source_daily_requested", 0) or 0)
          completed = int(data.get("completed", 0) or 0)
          if not data.get("dry_run") and source_requested > 0 and completed == 0:
              raise SystemExit("ERRORE: il generatore aveva articoli giornalieri ma WordPress ne ha elaborati zero. Consultare gli errori e gli artefatti del run.")
          if not data.get("dry_run") and source_requested > completed:
              print(f"AVVISO: pubblicazione parziale {completed}/{source_requested}; controllare gli errori per articolo.")
          PY

      - name: Salva risultati RSS anche in caso di errore
        if: ${{ always() && hashFiles('data/rss_output.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-rss
          path: data/rss_output.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva risultati AI anche in caso di errore
        if: ${{ always() && hashFiles('data/ai_candidates.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-ai-candidates
          path: data/ai_candidates.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva selezione giornaliera anche in caso di errore
        if: ${{ always() && hashFiles('data/daily_articles.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-daily-articles
          path: data/daily_articles.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva bozze articoli anche in caso di errore
        if: ${{ always() && hashFiles('data/article_drafts.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-article-drafts
          path: data/article_drafts.json
          if-no-files-found: error
          retention-days: 90

      - name: Salva report WordPress anche in caso di errore
        if: ${{ always() && hashFiles('data/wp_publish_report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-wp-publish-report
          path: data/wp_publish_report.json
          if-no-files-found: error
          retention-days: 90
