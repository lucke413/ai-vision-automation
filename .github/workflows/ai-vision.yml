name: AI Vision Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-vision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verifica configurazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name in ("data/rss_output.json", "data/ai_candidates.json"):
              Path(name).unlink(missing_ok=True)
          if not os.environ.get("GEMINI_API_KEY", "").strip():
              raise SystemExit("ERRORE: configura il secret GEMINI_API_KEY nel repository.")
          for name in (
              "scripts/rss_collector.py",
              "scripts/ai_filter.py",
              "scripts/daily_selector.py",
              "scripts/article_generator.py",
              "requirements.txt",
          ):
              if not Path(name).is_file():
                  raise SystemExit(f"ERRORE: file mancante: {name}")
          PY

      - name: Installa e verifica dipendenze
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m py_compile scripts/rss_collector.py scripts/ai_filter.py scripts/daily_selector.py scripts/article_generator.py

      - name: Raccogli notizie RSS
        run: python scripts/rss_collector.py

      - name: Controlla Collector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/rss_output.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("ERRORE: collector senza storie valide.")
          for item in items:
              if not isinstance(item, dict) or not item.get("title") or not item.get("url"):
                  raise SystemExit("ERRORE: storia incompleta nel collector.")
              if not isinstance(item.get("editorial_score"), (int, float)):
                  raise SystemExit("ERRORE: editorial_score mancante o non numerico.")
          print(f"OK: {len(items)} storie pronte per Gemini")
          PY

      - name: Analizza con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_filter.py

      - name: Controlla e mostra risultato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/ai_candidates.json").read_text(encoding="utf-8"))
          status = data.get("status")
          allowed_statuses = {"ok", "ok_with_warnings", "empty"}
          if status not in allowed_statuses:
              raise SystemExit("ERRORE: analisi AI non utilizzabile.")
          if data.get("total_final_candidates") != len(data.get("items", [])):
              raise SystemExit("ERRORE: conteggio candidati incoerente.")
          print(f"Articoli ricevuti: {data['total_received']}")
          print(f"Articoli analizzati: {data['total_analyzed']}")
          print(f"Errori Gemini tollerati: {data.get('total_errors', 0)}")
          print(f"Articoli non elaborati: {data.get('total_unprocessed', 0)}")
          print(f"Approvati: {data['total_passed_ai']}")
          print(f"Candidati finali: {data['total_final_candidates']}")
          if data.get("total_final_candidates", 0) < 5:
              print("AVVISO: meno di 5 candidati; il workflow prosegue con il lotto disponibile.")
          if status == "ok_with_warnings":
              print("AVVISO: il run prosegue con articoli esclusi per errori transitori.")
          for i, item in enumerate(data["items"], 1):
              print(f"{i}. [{item['final_score']}] [{item['category']}] {item['title']}")
          PY

      - name: Seleziona articoli giornalieri
        run: python scripts/daily_selector.py

      - name: Controlla selezione giornaliera
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/daily_articles.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if data.get("status") not in {"ok", "ok_with_warnings", "empty"} or not isinstance(items, list) or len(items) > 5:
              raise SystemExit("ERRORE: selezione giornaliera non valida.")
          ids = [item.get("article_id") for item in items]
          if not all(ids) or len(ids) != len(set(ids)):
              raise SystemExit("ERRORE: identificativi articolo mancanti o duplicati.")
          reserves = data.get("reserve_items", [])
          if not isinstance(reserves, list) or len(reserves) > 3:
              raise SystemExit("ERRORE: coda di riserva non valida.")
          reserve_ids = [item.get("article_id") for item in reserves]
          if any(item_id in ids for item_id in reserve_ids) or len(reserve_ids) != len(set(reserve_ids)):
              raise SystemExit("ERRORE: duplicati tra articoli giornalieri e riserve.")
          print(f"OK: {len(items)} articoli giornalieri; riserve: {len(reserves)}; offerte: {data.get('offer_count', 0)}")
          if data.get("offer_count", 0) > 1:
              print("AVVISO: più di un'offerta usata perché non c'erano abbastanza notizie non commerciali.")
          PY

      - name: Genera bozze articoli
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/article_generator.py

      - name: Controlla bozze articoli
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/article_drafts.json").read_text(encoding="utf-8"))
          items = data.get("items")
          if data.get("status") not in {"ok", "ok_with_warnings", "empty"} or not isinstance(items, list) or len(items) > 8:
              raise SystemExit("ERRORE: output bozze non valido.")
          ids = [item.get("draft_id") for item in items]
          if not all(ids) or len(ids) != len(set(ids)):
              raise SystemExit("ERRORE: bozze con identificativi mancanti o duplicati.")
          for item in items:
              if not item.get("body_markdown", "").strip() or not item.get("title"):
                  raise SystemExit("ERRORE: bozza senza contenuto.")
              if item.get("publication_slot") not in {"today", "reserve"}:
                  raise SystemExit("ERRORE: slot di pubblicazione mancante.")
          daily = sum(1 for item in items if item.get("publication_slot") == "today")
          reserve = sum(1 for item in items if item.get("publication_slot") == "reserve")
          print(f"OK: {len(items)} bozze generate; oggi: {daily}; riserve: {reserve}.")
          for warning in data.get("warnings", []):
              print(f"AVVISO: {warning}")
          PY

      - name: Salva risultati RSS anche in caso di errore
        if: ${{ always() && hashFiles('data/rss_output.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-rss
          path: data/rss_output.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva risultati AI anche in caso di errore
        if: ${{ always() && hashFiles('data/ai_candidates.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-ai-candidates
          path: data/ai_candidates.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva selezione giornaliera anche in caso di errore
        if: ${{ always() && hashFiles('data/daily_articles.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-daily-articles
          path: data/daily_articles.json
          if-no-files-found: error
          retention-days: 7

      - name: Salva bozze articoli anche in caso di errore
        if: ${{ always() && hashFiles('data/article_drafts.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-article-drafts
          path: data/article_drafts.json
          if-no-files-found: error
          retention-days: 7
