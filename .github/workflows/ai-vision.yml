name: AI Vision Automation

on:
  workflow_dispatch:

jobs:
  ai-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Raccogli notizie RSS
        run: |
          python scripts/rss_collector.py

      - name: Analizza notizie con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_filter.py

      - name: Mostra candidati selezionati
        run: |
          echo "======================================"
          echo "       AI VISION - RISULTATO AI"
          echo "======================================"

          python - <<'PY'
          import json

          with open("data/ai_candidates.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Articoli analizzati: {data['total_analyzed']}")
          print(f"Candidati: {data['publishable_candidates']}")
          print("")

          for item in data["items"]:
              ai = item.get("ai", {})

              if ai.get("publishable"):
                  print(
                      f"[{ai.get('score', 0)}] "
                      f"{item.get('title', '')}"
                  )
                  print(
                      f"Categoria: {ai.get('category', '')}"
                  )
                  print(
                      f"Motivo: {ai.get('reason', '')}"
                  )
                  print("")
          PY

      - name: Salva risultati RSS
        uses: actions/upload-artifact@v6
        with:
          name: ai-vision-rss
          path: data/rss_items.json

      - name: Salva risultati AI
        uses: actions/upload-artifact@v6
        with:
          name: ai-vision-ai-candidates
          path: data/ai_candidates.json
