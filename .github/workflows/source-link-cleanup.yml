name: AI Vision editorial source links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-link-cleanup.yml'
  workflow_dispatch:
    inputs:
      apply_cleanup:
        description: 'Rimuovi i link editoriali dagli articoli pubblicati e programmati'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-vision-editorial-source-cleanup
  cancel-in-progress: false

jobs:
  check-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test source-link rules
        run: python -m unittest discover -s tests -p 'test_wp_public_cleanup.py' -v
      - name: Restore the Galaxy Watch8 article layout from its backup
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-RESTORE-LAYOUT]') }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import io
          import json
          import os
          import zipfile
          from history_filter import api_get
          from public_source_links import clean_source_links
          from wp_public_cleanup import API, FIELDS, request_with_retry, wp_session

          artifact = api_get(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] +
              "/actions/artifacts/14429701517/zip", os.environ["GITHUB_TOKEN"]
          )
          with zipfile.ZipFile(io.BytesIO(artifact)) as backup:
              plan = json.loads(backup.read("commerce_calendar_articles_plan.json"))
          entry = next(item for item in plan["changes"] if item["id"] == 602)
          restored, _ = clean_source_links(entry["before_content"])

          client = wp_session()
          if not client.auth:
              raise RuntimeError("Credenziali WordPress non disponibili.")
          url = f"{API}/602"
          params = {"context": "edit", "_fields": FIELDS}
          before = request_with_retry(client, "get", url, params=params).json()
          if before["content"]["raw"] == restored:
              print("Articolo #602 già ripristinato.")
              raise SystemExit(0)
          if before["content"]["raw"] != entry["after_content"] or before["slug"] != entry["slug"]:
              raise RuntimeError("L'articolo è cambiato di nuovo. Controllare la revisione prima del ripristino.")
          request_with_retry(client, "post", url, params=params, json={"content": restored}, allow_redirects=False)
          after = request_with_retry(client, "get", url, params=params).json()
          assert after["content"]["raw"] == restored
          assert all(before[key] == after[key] for key in ("title", "slug", "featured_media", "date", "date_gmt", "status"))
          print("Articolo #602: immagine e link interni ripristinati, senza bibliografia pubblica.")
          PY
      - name: Inventory WordPress and prepare cleanup
        run: python scripts/wp_public_cleanup.py
      - name: Save published backups before writing
        if: ${{ inputs.apply_cleanup || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-SOURCE-CLEANUP]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: source-link-cleanup-backup-${{ github.run_id }}
          path: data/public_source_cleanup_backups.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply cleanup and verify originality
        if: ${{ inputs.apply_cleanup || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AI-VISION-SOURCE-CLEANUP]')) }}
        run: python scripts/wp_public_cleanup.py --apply
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-cleanup-report-${{ github.run_id }}
          path: data/public_source_cleanup.json
          if-no-files-found: warn
          retention-days: 30
