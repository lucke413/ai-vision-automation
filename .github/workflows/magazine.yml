name: AIVision Magazine
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, live, connect]
        default: preview
        description: Preview PDF, publish validated issue, or update existing Connect widget
  pull_request:
    paths: ['scripts/magazine/**', 'tests/test_magazine.py', 'requirements-magazine.txt', '.github/workflows/magazine.yml', 'magazine/**']
  push:
    branches: ['feat/weekly-magazine', 'main']
    paths: ['scripts/magazine/**', 'tests/test_magazine.py', '.github/workflows/magazine.yml', 'magazine/**']
  schedule:
    - cron: '0 9 * * 0'
      timezone: Europe/Rome
permissions:
  contents: read
concurrency:
  group: aivision-magazine
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-magazine.txt
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          WP_DRY_RUN: 'true'
  generate:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && vars.MAGAZINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      MAGAZINE_IMAGE_MODEL: ${{ vars.MAGAZINE_IMAGE_MODEL }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      NEWSLETTER_FORM_URL: ${{ vars.NEWSLETTER_FORM_URL }}
      NEWSLETTER_DOI_VERIFIED: ${{ vars.NEWSLETTER_DOI_VERIFIED }}
      RUN_MODE: ${{ github.event_name == 'push' && 'connect' || inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-magazine.txt
      - name: Generate or reconcile
        shell: bash
        run: |
          case "$RUN_MODE" in
            preview) python -m scripts.magazine.run --preview-art magazine/art ;;
            live) python -m scripts.magazine.run --live ;;
            connect) python -m scripts.magazine.run --connect-only ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aivision-magazine-${{ github.run_id }}
          path: magazine-output/
          retention-days: 90
