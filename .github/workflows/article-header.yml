name: AI Vision article layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-header.yml'
      - 'wordpress/article-header.php'
      - 'wordpress/related-cards.php'
      - 'wordpress/reading-widget.php'
      - 'wordpress/editorial-navigation.php'
      - 'wordpress/telegram-offers.php'
      - 'scripts/deploy_article_header.py'

permissions:
  contents: read

concurrency:
  group: aivision-article-header
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[AI-VISION-ARTICLE-HEADER]') || contains(github.event.head_commit.message, '[AI-VISION-RELATED-CARDS]') || contains(github.event.head_commit.message, '[AI-VISION-READING-WIDGET]') || contains(github.event.head_commit.message, '[AI-VISION-EDITORIAL-NAVIGATION]') || contains(github.event.head_commit.message, '[AI-VISION-TELEGRAM-OFFERS]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: php -l wordpress/article-header.php
      - run: php -l wordpress/related-cards.php
      - run: php -l wordpress/reading-widget.php
      - run: php -l wordpress/editorial-navigation.php
      - run: php -l wordpress/telegram-offers.php
      - run: python -m pip install -r requirements.txt
      - name: Attiva le barre Newsup e verifica il sito
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[AI-VISION-ARTICLE-HEADER]') }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/deploy_article_header.py
      - name: Sistema le schede correlate e verifica il sito
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[AI-VISION-RELATED-CARDS]') }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/deploy_article_header.py --related-cards
      - name: Attiva il widget di lettura e verifica il sito
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[AI-VISION-READING-WIDGET]') }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_TIMEZONE: Europe/Rome
        run: python scripts/deploy_article_header.py --reading-widget
      - name: Attiva la navigazione delle offerte e l’indice
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[AI-VISION-EDITORIAL-NAVIGATION]') }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/deploy_article_header.py --editorial-navigation
      - name: Attiva la fascia offerte Telegram e verifica il sito
        if: ${{ contains(github.event.head_commit.message, '[AI-VISION-TELEGRAM-OFFERS]') }}
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/deploy_article_header.py --telegram-offers
