name: AI Vision targeted WordPress repairs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/targeted_wp_repair.py'
      - '.github/workflows/targeted-wp-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivision-targeted-wp-repair
  cancel-in-progress: false

jobs:
  inspect-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Safe WordPress repair and inventory
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/targeted_wp_repair.py
      - name: Upload full verification report
        if: ${{ always() && hashFiles('data/targeted_wp_review.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-targeted-wp-review-${{ github.run_id }}
          path: data/targeted_wp_review.json
          retention-days: 90
