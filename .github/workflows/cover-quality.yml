name: AI Vision cover quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cover-quality.yml"
      - "scripts/cover_media.py"
      - "scripts/cover_quality_repair.py"
  workflow_dispatch:
    inputs:
      apply_corrections:
        description: "Schiarisci le immagini IA identificate con esposizione insufficiente"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-vision-inline-image-repair
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[AI-VISION-PHOTO-MODEL]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_wp_publisher_images tests.test_inline_image_repair -v
      - name: Verify and correct covers where needed
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          APPLY_CORRECTIONS: ${{ inputs.apply_corrections || contains(github.event.head_commit.message, '[AI-VISION-COVER-EXPOSURE]') }}
        run: |
          args=()
          if [ "$APPLY_CORRECTIONS" = true ]; then
            args+=(--apply)
          fi
          python scripts/cover_quality_repair.py "${args[@]}"
      - name: Upload cover audit without article content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-cover-quality
          path: data/cover_quality_report.json
          if-no-files-found: warn
          retention-days: 14
  generation-check:
    if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[AI-VISION-COVER-EXPOSURE]') || contains(github.event.head_commit.message, '[AI-VISION-PHOTO-MODEL]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cover.txt
      - run: python -m pip install -r requirements.txt -r requirements-cover.txt
      - name: Generate and check a cover with the production model
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          mkdir -p data
          python scripts/cover_media.py data/sample-cover.jpg
          python - <<'PY'
          from PIL import Image
          from scripts.cover_media import COVER_SIZE, cover_exposure
          with Image.open("data/sample-cover.jpg") as image:
              exposure = cover_exposure(image)
              print(f"Cover {image.width}×{image.height}, luminance {exposure.median}, usable {exposure.usable}")
              if image.size != COVER_SIZE or not exposure.usable:
                  raise SystemExit("Cover check failed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-vision-sample-cover
          path: data/sample-cover.jpg
          if-no-files-found: error
          retention-days: 7
