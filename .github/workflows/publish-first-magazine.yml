name: Build, validate and publish first real AIVision Magazine issue (image fallback)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-first-magazine.yml'

permissions:
  contents: write

concurrency:
  group: aivision-magazine-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
      MAGAZINE_IMAGE_MODEL: ${{ vars.MAGAZINE_IMAGE_MODEL }}
      MAGAZINE_IMAGE_SOURCE: ${{ vars.MAGAZINE_IMAGE_SOURCE || 'commons' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      NEWSLETTER_FORM_URL: ${{ vars.NEWSLETTER_FORM_URL }}
      NEWSLETTER_DOI_VERIFIED: ${{ vars.NEWSLETTER_DOI_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-magazine.txt
      - name: Compile and run regression tests
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate and validate the real PDF
        run: python -m scripts.magazine.run --output first-issue-preview
      - name: Publish the exact validated PDF and create the site archive
        run: python -m scripts.magazine.run --live --resume first-issue-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aivision-first-real-issue-${{ github.run_id }}
          path: first-issue-preview/
          retention-days: 90
