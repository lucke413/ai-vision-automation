name: AI Vision Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-vision-instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scarica repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifica publisher
        run: python -m py_compile scripts/instagram_publisher.py scripts/instagram_landing.py

      - name: Aggiorna pagina link in bio
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/instagram_landing.py

      - name: Sincronizza Instagram
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_EXPECTED_USERNAME: aivision_tech
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
        run: python scripts/instagram_publisher.py
