name: AI Vision inline image repair

on:
  push:
    branches: [main]
    paths:
      - "assets/cover-upgrades/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-vision-inline-image-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -r requirements.txt -r requirements-cover.txt
          fi

      - name: Compile and test repair
        run: |
          python -m py_compile scripts/wp_publisher.py scripts/inline_image_repair.py
          python -m unittest tests.test_inline_image_repair -v

      - name: Back up and update the selected covers
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_INLINE_IMAGE_REPAIR: "true"
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_REVISION: ${{ github.event.before }}
          CURRENT_REVISION: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != push ]; then
            python scripts/inline_image_repair.py
            exit
          fi
          paths=$(git diff --name-only --diff-filter=AM "$PREVIOUS_REVISION" "$CURRENT_REVISION" -- 'assets/cover-upgrades/*.jpg')
          args=()
          while IFS= read -r path; do
            if [[ $path =~ ^assets/cover-upgrades/([0-9]+)\.jpg$ ]]; then
              args+=(--upgrade-post "${BASH_REMATCH[1]}")
            fi
          done <<< "$paths"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "Nessuna nuova copertina da caricare."
            exit
          fi
          python scripts/inline_image_repair.py "${args[@]}"

      - name: Upload full backup and repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-inline-image-repair
          path: |
            data/inline_image_repair_backup.json
            data/inline_image_repair_report.json
          if-no-files-found: warn
          retention-days: 90
