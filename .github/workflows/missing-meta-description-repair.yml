name: AI Vision repair missing meta descriptions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/missing_meta_description_repair.py'
      - '.github/workflows/missing-meta-description-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivision-missing-meta-description-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Prepare descriptions from real article openings
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/missing_meta_description_repair.py prepare
      - name: Save SEO metadata backup
        uses: actions/upload-artifact@v4
        with:
          name: aivision-missing-meta-backup-${{ github.run_id }}
          path: |
            data/missing_meta_descriptions_plan.json
            data/missing_meta_descriptions_backup.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply and verify descriptions
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/missing_meta_description_repair.py apply
      - name: Upload verification result
        if: ${{ always() && hashFiles('data/missing_meta_descriptions_result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivision-missing-meta-result-${{ github.run_id }}
          path: data/missing_meta_descriptions_result.json
          retention-days: 90
